name: Playwright Tests - Nalarin.ai

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, fileinfo, sqlite3
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Copy .env
      run: cp .env.example .env

    - name: Set SQLite for CI
      run: |
        sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/g' .env
        sed -i 's/DB_DATABASE=nalarinAI/DB_DATABASE=:memory:/g' .env
        sed -i 's/SESSION_DRIVER=database/SESSION_DRIVER=file/g' .env
        sed -i 's/CACHE_STORE=database/CACHE_STORE=file/g' .env
        sed -i 's/QUEUE_CONNECTION=database/QUEUE_CONNECTION=sync/g' .env

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build

    - name: Install Playwright Chromium Browser
      run: npx playwright install chromium --with-deps

    - name: Start Laravel Server
      run: php artisan serve --port=8000 &
      env:
        APP_ENV: testing

    - name: Run Playwright Tests
      run: npx playwright test
      env:
        APP_URL: http://127.0.0.1:8000

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload Screenshot Bukti Pengujian
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: screenshot-bukti
        path: tests/e2e/*.png
        retention-days: 30
        if-no-files-found: ignore

